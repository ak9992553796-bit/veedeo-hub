<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Veedeo - ॐ नमः शिवाय</title>
<style>
body{font-family:system-ui;background:#fff8f0;margin:0;padding:10px}
h2{color:#d35400}
.card{border:1px solid #ddd;background:#fff;padding:10px;margin:8px 0;border-radius:12px;box-shadow:0 2px 6px #0001}
.btn{padding:8px 14px;border:none;border-radius:8px;cursor:pointer}
.btn-orange{background:#ff6600;color:#fff}
.speakerBtn{background:#fff0e0;border:1px solid #ff9900;border-radius:8px;padding:5px 10px;cursor:pointer}
#aiTeacherBox{position:fixed;bottom:12px;right:12px;z-index:99999;text-align:center;display:none;background:#fff;border:2px solid #ff6600;border-radius:18px;padding:8px 10px;box-shadow:0 4px 12px #0003}
#aiTeacherImg{width:90px;height:90px;border-radius:50%;object-fit:cover;transition:0.15s}
.teacherTalk #aiTeacherImg{transform:scale(1.08)}
#teacherMouth{width:20px;height:6px;background:#900;margin:-14px auto 0;border-radius:10px;transition:0.07s}
.talking #teacherMouth{height:14px;background:#c00}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}94%{transform:scaleY(0.1)}}.blink{animation:blink 3s infinite}
</style></head><body>
<h2>ॐ नमः शिवाय जी - Veedeo</h2>

<div id="aiTeacherBox"><img id="aiTeacherImg" class="blink" src="https://cdn-icons-png.flaticon.com/512/194/194938.png"><div id="teacherMouth"></div><div style="font-size:10px;background:#000;color:#fff;border-radius:5px;padding:2px 6px;margin-top:6px">Teacher बोल रही हैं जी</div></div>

<div class="card"><b>जॉइनिंग बटन है जी</b><br><br><button class="btn btn-orange" onclick="doJoin()">जॉइन करो जी</button><div id="usersDiv" style="margin-top:10px"></div></div>
<div class="card"><b>Wallet बटन है जी</b><div id="walletDiv">0 जी</div></div>
<div class="card"><b>Tree बटन है जी</b><div id="treeDiv"></div></div>
<div class="card"><b>1 से 55 बटन हैं जी</b><div id="btnsDiv"></div></div>
<div class="card"><b>Blog बटन है जी</b><div id="blogDiv"></div><button onclick="addBlog()">Blog लिखो जी</button></div>
<div class="card"><b>TDS और सुधार नोट बटन है जी</b><div id="tdsDiv">TDS 0% जी</div></div>

<script>
const USERS_KEY="veedeo_users_v69"; const WALLET_KEY="veedeo_wallet_v69"; const BLOGS_KEY="veedeo_blogs_v69";

const BUTTONS=[
{n:1,name:"1. बटन",url:"https://www.google.com",desc:"ये पहला बटन है जी"},
{n:2,name:"2. बटन",url:"https://www.google.com",desc:"ये दूसरा बटन है जी"},
{n:3,name:"3. बटन",url:"https://www.google.com",desc:"ये तीसरा बटन है जी"},
{n:4,name:"4. बटन",url:"https://www.google.com",desc:"ये चौथा बटन है जी"},
{n:5,name:"5. बटन",url:"https://www.google.com",desc:"ये पाँचवाँ बटन है जी"},
{n:6,name:"6. बटन",url:"https://www.google.com",desc:"ये छठा बटन है जी"},
{n:7,name:"7. बटन",url:"https://www.google.com",desc:"ये सातवाँ बटन है जी"},
{n:8,name:"8. बटन",url:"https://www.google.com",desc:"ये आठवाँ बटन है जी"},
{n:9,name:"9. बटन",url:"https://www.google.com",desc:"ये नौवाँ बटन है जी"},
{n:10,name:"10. बटन",url:"https://www.google.com",desc:"ये दसवाँ बटन है जी"},
{n:54,name:"54. FLIPKART HOME - Shopping Home बटन है जी",url:"https://www.flipkart.com/",desc:"Flipkart Home बटन है जी - ये शॉपिंग का बटन है जी"},
{n:55,name:"55. JIO APP - MyJio - रिचार्ज का बटन है जी",url:"https://www.jio.com/selfcare/recharge/mobility/",desc:"Jio App बटन है जी - ये रिचार्ज का बटन है जी - MyJio App से Jio रिचार्ज करो जी - मेंबर है तो बटन दबाते ही असली App से रिचार्ज हो जाएगा जी"}
];
for(let i=11;i<=53;i++){ BUTTONS.splice(i-1,0,{n:i,name:i+". बटन है जी",url:"https://www.google.com",desc:"ये "+i+" नंबर बटन है जी"}); }

function speakTeacher(text){
 let box=document.getElementById("aiTeacherBox"), mouth=document.getElementById("teacherMouth");
 box.style.display="block"; box.classList.add("teacherTalk","talking");
 speechSynthesis.cancel();
 let u=new SpeechSynthesisUtterance(text); u.lang="hi-IN"; u.rate=0.88; u.pitch=1.05;
 u.onboundary=()=>{ mouth.style.height=Math.random()>0.5?"14px":"3px"; }
 u.onend=()=>{ box.classList.remove("teacherTalk","talking"); mouth.style.height="6px"; setTimeout(()=>{box.style.display="none"},1500); };
 speechSynthesis.speak(u);
}

function doJoin(){
 let name=prompt("नाम लिखो जी"); if(!name) return;
 let users=JSON.parse(localStorage.getItem(USERS_KEY)||"[]");
 users.push({name:name,date:new Date().toLocaleString("hi-IN"),id:Date.now()});
 localStorage.setItem(USERS_KEY,JSON.stringify(users));
 let w=parseInt(localStorage.getItem(WALLET_KEY)||"0"); w+=10; localStorage.setItem(WALLET_KEY,w);
 renderAll(); speakTeacher(name+" जी आपकी जॉइनिंग हो गई जी");
}
function addBlog(){
 let t=prompt("Blog लिखो जी - ये Auto नहीं जाएगा जी - आप खुद लिखोगे जी"); if(!t) return;
 let blogs=JSON.parse(localStorage.getItem(BLOGS_KEY)||"[]"); blogs.push(t); localStorage.setItem(BLOGS_KEY,JSON.stringify(blogs)); renderAll();
}
function renderAll(){
 let users=JSON.parse(localStorage.getItem(USERS_KEY)||"[]");
 document.getElementById("usersDiv").innerHTML=users.length?users.map((u,i)=>`${i+1}. ${u.name} जी - ${u.date}`).join("<br>"):"अभी कोई जॉइनिंग नहीं जी - आपकी 4 जॉइनिंग यहीं आएगी जी";
 document.getElementById("walletDiv").innerHTML=(localStorage.getItem(WALLET_KEY)||"0")+" रूपये जी";
 document.getElementById("treeDiv").innerHTML=users.map((u,i)=>`Level ${i+1} - ${u.name} जी`).join("<br>")||"Tree खाली है जी";
 let blogs=JSON.parse(localStorage.getItem(BLOGS_KEY)||"[]");
 document.getElementById("blogDiv").innerHTML=blogs.map(b=>`<div>${b} <button class=speakerBtn onclick="speakTeacher('${b.replace(/'/g,"")}')">👩‍🏫 सुनो जी</button></div>`).join("<br>")||"कोई Blog नहीं है जी";
 document.getElementById("btnsDiv").innerHTML=BUTTONS.map(b=>`<div style="border:1px solid #eee;padding:8px;margin:6px;border-radius:10px"><b>${b.name}</b><br><button class=speakerBtn onclick="speakTeacher('${b.desc.replace(/'/g,"")}')">👩‍🏫 Teacher सुनो जी</button> <a href="${b.url}" target="_blank" style="margin-left:8px">खोलो जी</a><br><small>${b.desc}</small></div>`).join("");
}
renderAll();
</script>
</body></html>
