<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINAL - Product पर सच में Tag</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3922664797100594" crossorigin="anonymous"></script>
<style>
body{background:#000;color:#FFD700;font-family:system-ui;padding:12px}
.box{border:3px solid #FFD700;border-radius:16px;padding:12px;margin-bottom:14px;background:#000}
.green{border-color:#00FF00;box-shadow:0 0 12px #00FF00}
.tag{border:2px solid #00FF00;border-radius:10px;padding:12px;text-align:center;font-weight:700;word-break:break-all;background:#111}
.prod{background:#111;border:1px solid #333;border-radius:10px;padding:8px;margin:6px 0;display:flex;justify-content:space-between}
.prod a{color:#00FF00;font-weight:700;word-break:break-all;font-size:12px}
.debug{font-size:11px;background:#1a1a1a;border:1px dashed #555;padding:8px;border-radius:8px;word-break:break-all;color:#aaa;margin-top:8px}
</style>
</head>
<body>

<div class="box green">
  <div style="text-align:center;color:#00FF00;font-weight:700">4 CHECK: Server Live - Live Tag ON - 120 Apps</div>
  <div class="tag" id="liveTag">Loading 2 नंबर...</div>
  <div style="text-align:center;font-size:12px" id="counter"></div>
</div>

<div class="box">
  <div style="font-weight:700;text-align:center">🛒 Amazon Product - Tag सच में लग रहा है</div>
  <div class="prod"><div>Product 1</div><a class="amazon-product" data-base="https://www.amazon.in/dp/B08Z1ou9V" href="https://www.amazon.in/dp/B08Z1ou9V?tag=veedeohub-21" target="_blank">Buy</a></div>
  <div class="debug" id="proof">Proof Loading...</div>
</div>

<script>
// सब -21 पर खत्म ताकि Tag 21 गलत न हो
const TAGS = [];
TAGS[0] = "veedeohub-21-SKIP"; // 1 Skip - बग वाला
TAGS[1] = "veedeohub-21"; // 2 से शुरू - आपका वाला
TAGS[2] = "ashok0499-21";
for(let i=3;i<120;i++) TAGS[i] = `app${String(i+1).padStart(3,'0')}-21`;

let idx = 1;
function updateReal(){
  const tag = TAGS[idx];
  const time = new Date().toLocaleTimeString();
  document.getElementById('liveTag').innerText = tag + " - " + (idx+1) + "/120 - " + time;
  document.getElementById('counter').innerText = "अभी " + (idx+1) + " / 120";

  // यही लाइन सच में Product पर tag लगाती है
  document.querySelectorAll('.amazon-product').forEach(a=>{
    a.href = a.dataset.base.split('?')[0] + "?tag=" + tag;
  });

  document.getElementById('proof').innerText = "✅ Live Link: " + document.querySelector('.amazon-product').href;
  idx++; if(idx>=120) idx=1;
}
updateReal();
setInterval(updateReal, 2500);
</script>
</body>
</html>
